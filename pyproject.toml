[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ears-trace"
version = "0.1.0"
description = "EARS要件からテスト・トレーサビリティを機械的に可視化するCLIツール"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sh_fukatsu" }]
keywords = ["ears", "requirements", "traceability", "testing", "pytest", "coverage"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[project.scripts]
ears-trace = "ears_trace.cli:main"

[project.urls]
Homepage = "https://github.com/sh-fukatsu/ears-trace"

[tool.hatch.build.targets.wheel]
packages = ["src/ears_trace"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E,F=pyflakes/pycodestyle, I=isort, UP=pyupgrade, B=bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: ユニットテスト",
    "integration: 統合テスト",
    "property: プロパティベーステスト",
    "requirement(id): このテストが充足するEARS要件IDを宣言する",
]
addopts = "-ra"

[tool.coverage.run]
source = ["src/ears_trace"]
branch = true
